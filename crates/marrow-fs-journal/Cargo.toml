[package]
name = "marrow-fs-journal"
description = "Sole descriptor-rooted filesystem publication owner: entry-name admission, admitted-directory custody, the cooperative cache lock, and the bounded five-kind pending-journal frame with replay and crash-debris classification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Exact pin, default features off, feature set exactly {std, fs}. Any added feature
# word, version move, or second consuming crate needs maintainer approval; the
# dependency-condition tests enforce the feature set, the single-manifest boundary,
# and that no second package unions further features into the resolved set.
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
