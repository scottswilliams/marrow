[package]
name = "marrow-test-support"
description = "The test scaffolding more than one binary builds over: the one scratch directory, the image draft seam and forger, the ledger-id fixtures, the engine doubles, and the verifier's tracer corpus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Test scaffolding, never a shipped artifact: every consumer names it as a dev edge.
publish = false

[dependencies]
marrow-image = { path = "../marrow-image" }
marrow-kernel = { path = "../marrow-kernel" }
marrow-project = { path = "../marrow-project" }
# The byte-engine traits the engine doubles implement; the path kernel stays the
# engine's only production consumer.
marrow-store = { path = "../marrow-store" }

[lints]
workspace = true
