[package]
name = "marrow-project-fs"
description = "Bounded physical project-input adapter for Marrow tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
marrow-codes = { path = "../marrow-codes" }
# The sole descriptor-rooted filesystem publication owner. `.marrow/ids` is a
# project-root artifact, so its publication owner is this adapter; the edge is
# what keeps the rename/link/sync/recovery model single.
marrow-fs-journal = { path = "../marrow-fs-journal" }
marrow-project = { path = "../marrow-project" }

[lints]
workspace = true
