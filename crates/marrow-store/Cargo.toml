[package]
name = "marrow-store"
description = "Marrow's saved-tree encoding and backend contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
marrow-codes = { path = "../marrow-codes" }
redb = { version = "4", optional = true }

[features]
# The native persistent backend (redb). Off by default so a dependent that needs
# only the in-memory engine stays dependency-light; marrow-kernel enables it
# unconditionally, so every build that reaches durable storage carries it.
native = ["dep:redb"]

[lints]
workspace = true

[dev-dependencies]
# The workspace test scaffolding: the one scratch directory and the shared fixture builders.
marrow-test-support = { path = "../marrow-test-support" }
