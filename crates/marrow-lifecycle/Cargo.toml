[package]
name = "marrow-lifecycle"
description = "Privileged persistent-store lifecycle: store identity, the persisted envelope and logical active head, and the provision/open composition over the image, runtime, and engine owners."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
marrow-codes = { path = "../marrow-codes" }
# The sole descriptor-rooted filesystem owner. Owner-held admission of the store
# directory's own artifacts is a no-follow, single-link, identity-witnessed read,
# which this crate consumes rather than reimplementing; it adds no third-party
# edge, since that crate's private syscall adapter stays behind its typed boundary.
marrow-fs-journal = { path = "../marrow-fs-journal" }
marrow-image = { path = "../marrow-image" }
marrow-kernel = { path = "../marrow-kernel" }
# The workspace's one JSON lexer; the flat-row importer reads its scalars through it.
marrow-local-wire = { path = "../marrow-local-wire" }
marrow-verify = { path = "../marrow-verify" }

[dev-dependencies]
marrow-project = { path = "../marrow-project" }
marrow-compile = { path = "../marrow-compile" }
marrow-vm = { path = "../marrow-vm" }
# The image fixtures more than one crate's tests build over: the admitted plan, the
# armed draft transaction, the site seam, and the container byte forger.
marrow-test-support = { path = "../marrow-test-support" }
# The compiled programs the lifecycle suites run against.
marrow-test-programs = { path = "../marrow-test-programs" }

[lints]
workspace = true
