name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Pinned to the workspace MSRV so CI agrees byte-for-byte with the local
      # fmt/clippy gates. A floating stable runner repeatedly broke pushes with
      # lints the pinned toolchain does not carry; the advisory job below tracks
      # stable drift without gating integration.
      RUSTUP_TOOLCHAIN: 1.89.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-features enables marrow-store's `native` (redb) backend so the
      # native engine and its conformance suite are gated alongside the memory
      # backend. The reduced workspace is exactly marrow-codes, marrow-syntax,
      # marrow-store, and the thin marrow CLI.
      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked

      # Runs the retained-crate tests, including the standing anti-legacy tidy
      # gate (marrow-codes) that asserts the workspace membership and the absence
      # of every forbidden legacy family from the tracked source. The
      # differential-oracle harness's binary-invoking test is #[ignore], so CI
      # never requires the archived oracle.
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Clippy and unsafe check
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -F unsafe-code

  release-perf:
    name: Rust (release perf)
    runs-on: ubuntu-latest
    # Gating, like the matrix job above. The query-local latency budgets assert
    # only when `debug_assertions` is off, so an unoptimized battery records the
    # measurement and enforces nothing; without this job the budgets are never a
    # fence anywhere. An advisory perf gate would be the same defect one level
    # up, so a runtime that proves flaky here is downgraded by a recorded
    # decision rather than a silent edit.
    #
    # The optimized build is CI's cost and not the developer's default clock.
    # It builds marrow-compile and everything beneath it at the release profile,
    # but only the query_local_syntax test target above that, and it runs
    # exactly the two release-asserting budget tests — never the whole battery a
    # second time.
    env:
      RUSTUP_TOOLCHAIN: 1.89.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal

      # Keyed apart from every other job: this is the only cached target
      # directory in the workflow, and it holds optimized artifacts that no
      # unoptimized job may restore. A lock change starts a fresh entry, and
      # stale entries expire on GitHub's own eviction, so the cache grows across
      # lock revisions; if its restore/save time ever rivals the build it saves,
      # drop the target directory from the path list.
      - name: Cache optimized build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-perf-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-perf-${{ runner.os }}-1.89.0-

      # Separated from the timed run so the reported wall time is the tests'
      # and not the compiler's.
      - name: Build release perf target
        run: cargo test --release -p marrow-compile --test query_local_syntax --locked --no-run

      # Each named budget is asserted to have actually run: a filter that
      # matches nothing exits zero and reports a green run of no tests, so a
      # rename would retire the budget silently. The summary line is the check
      # rather than `--list`, because `--list` names an `#[ignore]`d test just
      # as it names a running one and would miss that second way to lose the
      # budget. The wall time covers cargo's freshness passes and both runs; it
      # is printed for the speed baseline that tracks this leg.
      - name: Run release-only latency budgets
        run: |
          set -o pipefail
          started=$(date +%s)
          for t in \
            a_query_over_a_maximum_admitted_file_stays_in_budget_when_optimized \
            a_query_over_an_ordinary_file_stays_far_inside_the_budget_when_optimized
          do
            cargo test --release -p marrow-compile --test query_local_syntax --locked -- \
              --exact --nocapture "$t" 2>&1 | tee "$RUNNER_TEMP/$t.log"
            grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/$t.log"
          done
          echo "release perf leg wall time: $(( $(date +%s) - started ))s"

  stable-advisory:
    name: Rust (stable advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      # Early warning for upcoming-toolchain lint drift; never gates a push.
      - name: Clippy (stable, advisory)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -F unsafe-code

  supply-chain-advisory:
    name: Supply chain (advisory)
    runs-on: ubuntu-latest
    # Non-gating, like stable-advisory: an upstream RustSec advisory or SBOM
    # tooling change must never red the required matrix or block a push. A real
    # advisory here is a finding to triage, not an integration stop. cargo-audit
    # and cargo-cyclonedx are CI-only tool installs; neither is a workspace
    # dependency, and neither touches Cargo.lock.
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install advisory tools
        run: cargo install cargo-audit cargo-cyclonedx --locked

      # Scans the committed Cargo.lock against the RustSec advisory database.
      - name: Audit dependencies
        run: cargo audit

      # Emits a CycloneDX SBOM per crate from cargo metadata; does not build or
      # resolve new dependencies and leaves Cargo.lock byte-unchanged.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error

  extension-advisory:
    name: VS Code extension (advisory)
    runs-on: ubuntu-latest
    # Non-gating, like stable-advisory and supply-chain-advisory: an extension
    # toolchain or typecheck regression must never red the required matrix or block a
    # push. It tracks the editors/vscode host's platform-independent health — a
    # dependency install under the repo's ignore-scripts policy and a no-emit
    # TypeScript typecheck.
    #
    # Bounded to what ubuntu can prove. The full editors/vscode/gate/verify-vsix.mjs
    # inventory, single-Mach-O payload, hash-pin, and reproducible-build checks require
    # a packaged VSIX whose payload is the pinned aarch64-apple-darwin release binary;
    # that darwin payload is produced and verified in the macOS packaging lane, not
    # here, so it is the darwin-only remainder this advisory job does not cover.
    continue-on-error: true
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ignore-scripts is enforced by editors/vscode/.npmrc, so no dependency
      # lifecycle script runs during install.
      - name: Install extension dependencies
        run: npm ci

      - name: Typecheck (no emit)
        run: npx tsc --noEmit -p ./
