name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install --profile minimal --component clippy --component rustfmt

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-features enables marrow-store's `native` (redb) backend so the
      # native engine and its conformance suite are gated alongside the memory
      # backend.
      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

      # `--force-warn` keeps the two structural budgets in `[workspace.lints.clippy]`
      # visible without `-D warnings` promoting their existing hits to errors.
      - name: Clippy and unsafe check
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- \
            -D warnings -F unsafe-code \
            --force-warn clippy::too_many_lines --force-warn clippy::cognitive_complexity

  release-perf:
    name: Rust (release perf)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Cache optimized build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-perf

      - name: Build release perf target
        run: cargo test --release -p marrow-compile --test query_local_syntax --locked --no-run

      # The latency budgets assert only when `debug_assertions` is off, so this
      # job is the only place they are a fence. Each budget is asserted to have
      # actually run: a filter that matches nothing exits zero and reports a
      # green run of no tests, so a rename would retire the budget silently.
      # `--list` would not catch it, because it names an `#[ignore]`d test just
      # as it names a running one.
      - name: Run release-only latency budgets
        run: |
          set -o pipefail
          started=$(date +%s)
          for t in \
            a_query_over_a_maximal_file_inside_the_image_bound_stays_in_budget_when_optimized \
            a_query_over_an_ordinary_file_stays_far_inside_the_budget_when_optimized
          do
            cargo test --release -p marrow-compile --test query_local_syntax --locked -- \
              --exact --nocapture "$t" 2>&1 | tee "$RUNNER_TEMP/$t.log"
            grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/$t.log"
          done
          echo "release perf leg wall time: $(( $(date +%s) - started ))s"
