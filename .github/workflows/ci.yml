name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install extension dependencies without lifecycle scripts
        run: npm ci
      - name: Apply and test pinned client cleanup
        run: npm test
      - name: Compile extension
        run: npm run compile

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-features enables marrow-store's `native` (redb) backend so the
      # native engine and its conformance suite are gated alongside the memory
      # backend.
      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Test documentation examples and public boundaries
        run: cargo test --workspace --doc --all-features --locked

      # These tests are `#[ignore]`d for two reasons: the socket, child-process,
      # and Node journeys because the local development sandbox denies binding
      # a Unix socket and spawning a runner, and the two durable-state budget
      # tests because each burns the whole instruction budget. The hosted
      # runners have no sandbox and ship Node, so the ignored battery of the
      # runner crate and of the CLI's journey, wire, and durable-state binaries
      # runs here. Each leg is asserted to have run at least one test: a filter
      # that matches nothing exits zero.
      - name: Test (socket, process, and Node journeys)
        run: |
          set -o pipefail
          cargo test -p marrow-runner --all-targets --all-features --locked -- --ignored 2>&1 \
            | tee "$RUNNER_TEMP/ignored-runner.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/ignored-runner.log"
          cargo test -p marrow --all-features --locked \
            --test journeys --test wire --test durable_state -- --ignored 2>&1 \
            | tee "$RUNNER_TEMP/ignored-marrow.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/ignored-marrow.log"

      - name: Clippy and unsafe check
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- \
            -D warnings -F unsafe-code

  release-perf:
    name: Rust (release perf)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache optimized build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-perf

      - name: Build release perf target
        run: cargo test --release -p marrow-compile --test query_local_syntax --locked --no-run

      # The latency budgets assert only when `debug_assertions` is off, so this
      # job is the only place they are a fence. Each budget is asserted to have
      # actually run: a filter that matches nothing exits zero and reports a
      # green run of no tests, so a rename would retire the budget silently.
      # `--list` would not catch it, because it names an `#[ignore]`d test just
      # as it names a running one.
      - name: Run release-only latency budgets
        run: |
          set -o pipefail
          started=$(date +%s)
          for t in \
            a_query_over_a_maximal_file_inside_the_image_bound_stays_in_budget_when_optimized \
            a_query_over_an_ordinary_file_stays_far_inside_the_budget_when_optimized
          do
            cargo test --release -p marrow-compile --test query_local_syntax --locked -- \
              --exact --nocapture "$t" 2>&1 | tee "$RUNNER_TEMP/$t.log"
            grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/$t.log"
          done
          echo "release perf leg wall time: $(( $(date +%s) - started ))s"
